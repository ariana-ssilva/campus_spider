services:
  - type: web
    name: tcc-web
    env: docker
    branch: main
    plan: free
    dockerfilePath: Dockerfile
    startCommand: python server.py
    envVars:
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: tcc-db
          property: connectionString

databases:
  - name: tcc-db
    plan: free
    databaseName: campus_spider
    user: campus_spider
