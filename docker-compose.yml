services:
  mysql:
    image: mysql:8.0
    container_name: mysql-campus-spider
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_spider}
    ports:
      - "3308:3306"
    volumes:
      - campus_spider_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  campus_spider_mysql_data:
