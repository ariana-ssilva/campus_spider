<section class="student-view hidden" data-student-view="ranking">
  <div class="panel view-panel">
    <div class="view-head">
      <div>
        <p class="eyebrow">Menu do aluno</p>
        <h2>Ranking de alunos</h2>
        <p id="studentRankingSummary">-</p>
      </div>
      <div class="view-head-actions">
        <button type="button" class="btn-primary" data-action="start-game">Jogar agora</button>
        <button type="button" class="btn-outline" data-target-view="profile">Ver perfil</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Nome</th>
            <th>XP</th>
            <th>Nível</th>
            <th>Partidas</th>
          </tr>
        </thead>
        <tbody id="studentRankingTableBody"></tbody>
      </table>
    </div>
  </div>
</section>
