<div class="teacher-panel-section hidden" data-teacher-view="profile">
  <div class="view-head">
    <div>
      <h2>Perfil do professor</h2>
      <p>Consulte seus dados de acesso e acompanhe sua atuação no sistema.</p>
    </div>
    <div class="view-head-actions">
      <button type="button" class="btn-outline" data-target-view="home"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao início</button>
    </div>
  </div>
  <div class="profile-grid teacher-profile-grid">
    <article class="profile-card profile-card-hero">
      <p class="eyebrow">Usuário atual</p>
      <h3 id="teacherProfileName">-</h3>
      <p id="teacherProfileEmail">-</p>
      <p id="teacherProfileRole">Professor</p>
    </article>
    <article class="profile-card">
      <span>Palavras cadastradas</span>
      <strong id="teacherProfileWords">0</strong>
    </article>
    <article class="profile-card">
      <span>Alunos cadastrados</span>
      <strong id="teacherProfileStudents">0</strong>
    </article>
    <article class="profile-card">
      <span>Partidas registradas</span>
      <strong id="teacherProfileGames">0</strong>
    </article>
  </div>
</div>
