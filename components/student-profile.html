<section class="student-view hidden" data-student-view="profile">
  <div class="panel view-panel">
    <div class="view-head">
      <div>
        <p class="eyebrow">Menu do aluno</p>
        <h2>Perfil do aluno</h2>
        <p>Veja seu progresso, nível e pontuações pessoais.</p>
      </div>
      <div class="view-head-actions">
        <button type="button" class="btn-primary" data-action="start-game">Continuar jogando</button>
        <button type="button" class="btn-outline" data-target-view="ranking">Ver ranking</button>
      </div>
    </div>
    <div class="profile-grid">
      <article class="profile-card profile-card-hero">
        <p class="eyebrow">Usuário atual</p>
        <h3 id="profileName">-</h3>
        <p id="profileEmail">-</p>
        <p id="profileRole">-</p>
      </article>
      <article class="profile-card">
        <span>XP</span>
        <strong id="profileXp">0</strong>
      </article>
      <article class="profile-card">
        <span>Nível</span>
        <strong id="profileLevel">1</strong>
      </article>
      <article class="profile-card">
        <span>Partidas</span>
        <strong id="profileMatches">0</strong>
      </article>
      <article class="profile-card">
        <span>Última pontuação</span>
        <strong id="profileLastScore">0</strong>
      </article>
      <article class="profile-card">
        <span>Melhor pontuação</span>
        <strong id="profileBestScore">0</strong>
      </article>
    </div>
  </div>
</section>
