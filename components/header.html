<header id="topbar" class="topbar">
  <div class="brand-wrap">
    <div class="brand-mark">🎓</div>
    <div>
      <h1>SpiderEDU</h1>
      <p class="brand-subtitle">Paciência Educativa</p>
    </div>
  </div>

  <nav class="top-nav" aria-label="Navegacao principal">
    <ul>
      <li class="active">
        <span class="nav-icon">⌂</span>
        <span>Início</span>
      </li>
      <li>

      <li>
        <span class="nav-icon">◈</span>
        <span>Desafios</span>
      </li>
      <li>

        <span>Ranking</span>
      </li>
      <li>
        <span class="nav-icon">◉</span>
        <span>Perfil</span>
      </li>
    </ul>
  </nav>

      <div class="level-progress">
        <div class="level-progress-fill"></div>
      </div>
    </div>

      <span id="topXpValue">0 XP</span>
