<div class="teacher-panel-section hidden" data-teacher-view="users">
  <div class="teacher-grid">
    <div class="teacher-box teacher-box-wide">
      <h3>CRUD de usuários</h3>
      <form id="userForm" class="form-grid teacher-form-grid">
        <input type="hidden" id="userIdInput" />
        <label>
          Nome
          <input type="text" id="userNameInput" required />
        </label>
        <label>
          Email
          <input type="email" id="userEmailInput" required />
        </label>
        <label>
          Senha
          <input type="text" id="userPasswordInput" required />
        </label>
        <label>
          Perfil
          <select id="userRoleInput" required>
            <option value="student">Aluno</option>
            <option value="teacher">Professor</option>
          </select>
        </label>
        <label>
          XP
          <input type="number" id="userXpInput" min="0" value="0" required />
        </label>
        <label>
          Partidas
          <input type="number" id="userMatchesInput" min="0" value="0" required />
        </label>
        <div class="teacher-form-actions">
          <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Salvar usuário</button>
          <button type="button" id="cancelUserEditBtn" class="btn-outline"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar edição</button>
        </div>
      </form>

      <div class="table-wrap">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Perfil</th>
              <th>XP</th>
              <th>Partidas</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="userCrudBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
