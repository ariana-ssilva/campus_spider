<div class="teacher-panel-section hidden" data-teacher-view="words">
  <div class="teacher-grid">
    <div class="teacher-box teacher-box-wide">
      <h3>CRUD de palavras</h3>
      <form id="wordForm" class="form-grid">
        <input type="hidden" id="wordIdInput" />
        <label>
          Palavra
          <input type="text" id="wordInput" required />
        </label>
        <label>
          Tema
          <input type="text" id="themeInput" required />
        </label>
        <label>
          Dificuldade (1-13)
          <input type="number" id="difficultyInput" min="1" max="13" required />
        </label>
        <div class="teacher-form-actions">
          <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Salvar palavra</button>
          <button type="button" id="cancelWordEditBtn" class="btn-outline"><i class="fa-solid fa-xmark" aria-hidden="true"></i> Cancelar edição</button>
        </div>
      </form>

      <div class="table-wrap">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Palavra</th>
              <th>Tema</th>
              <th>Dificuldade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="wordCrudBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
