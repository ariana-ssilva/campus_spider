<div class="teacher-panel-section" data-teacher-view="home">
  <div class="view-head">
    <div>
      <p class="eyebrow">Menu do professor</p>
      <h2>Painel do professor</h2>
      <p>Resumo geral da turma, conteúdo e partidas registradas.</p>
    </div>
    <div class="view-head-actions">
      <button type="button" class="btn-primary" data-target-view="words">Gerenciar palavras</button>
      <button type="button" class="btn-outline" data-target-view="users">Gerenciar usuários</button>
    </div>
  </div>

  <div class="mini-stats-grid" id="teacherHomeStats"></div>
  <div class="teacher-home-grid">
    <article class="teacher-home-card">
      <h3>Destaque da turma</h3>
      <div id="teacherHomeSpotlight" class="stacked-text"></div>
    </article>
    <article class="teacher-home-card">
      <h3>Partidas recentes</h3>
      <ul id="teacherHomeRecentGames" class="bullet-list"></ul>
    </article>
  </div>
</div>
