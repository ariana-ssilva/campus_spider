<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Spider - Estudos Gamificados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-layer"></div>
    <div id="headerSlot"></div>
    <main>
      <div id="authSlot"></div>

      <!-- Student views -->
      <section id="studentSection" class="hidden">
        <div id="studentHomeSlot"></div>
        <div id="studentModulesSlot"></div>
        <div id="studentChallengesSlot"></div>
        <div id="studentRankingSlot"></div>
        <div id="studentProfileSlot"></div>
      </section>

      <!-- Teacher views -->
      <section id="teacherSection" class="panel hidden">
        <div id="teacherHomeSlot"></div>
        <div id="teacherWordsSlot"></div>
        <div id="teacherUsersSlot"></div>
        <div id="teacherGamesSlot"></div>
        <div id="teacherRankingSlot"></div>
      </section>
    </main>
    <div id="modalSlot"></div>

    <script type="module" src="layout.js"></script>
  </body>
</html>
